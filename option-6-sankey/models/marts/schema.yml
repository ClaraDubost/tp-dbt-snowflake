version: 2

models:
  # ========== TABLES MARTS (ANALYTIQUES) ==========
  - name: fct_missions_incremental
    description: |
      **Table de faits des missions avec chargement incrémental simple**
      
      Vue consolidée des missions avec leurs statuts et informations enrichies.
      Matérialisée en mode incrémental pour optimiser les performances.
      
      **Stratégie incrémentale :** Nouveaux statuts uniquement
      **Clé unique :** [id_mission, date_statut]
      **Usage :** Reporting quotidien et analyses de performance
    columns:
      - name: id_mission
        description: "🔑 Identifiant unique de la mission"
      - name: id_commercial
        description: "🔗 Identifiant du commercial"
      - name: nom_commercial
        description: "👤 Nom du commercial prescripteur"
      - name: prenom_commercial
        description: "👤 Prénom du commercial prescripteur"
      - name: nom_entreprise
        description: "🏢 Nom de l'entreprise cliente"
      - name: titre_mission
        description: "📋 Titre de la mission"
      - name: statut
        description: "📊 Statut actuel dans le funnel"
      - name: date_statut
        description: "📅 Date du changement de statut"
      - name: commentaire
        description: "💬 Commentaire sur le statut"
      - name: source_batch
        description: "📦 Batch source pour traçabilité"
      - name: loaded_at
        description: "⏰ Timestamp de traitement dbt"

  - name: fct_missions_window
    description: |
      **Table de faits avec stratégie de fenêtre glissante**
      
      Version optimisée pour corriger les données historiques.
      Recharge automatiquement la dernière semaine pour gérer les corrections tardives.
      
      **Stratégie incrémentale :** Fenêtre glissante de 7 jours
      **Clé unique :** [id_mission, date_statut]
      **Avantage :** Corrige automatiquement les erreurs de saisie
      **Usage :** Analyses nécessitant une précision maximale
    columns:
      - name: id_mission
        description: "🔑 Identifiant unique de la mission"
      - name: id_commercial
        description: "🔗 Identifiant du commercial"
      - name: nom_commercial
        description: "👤 Nom du commercial prescripteur"
      - name: prenom_commercial
        description: "👤 Prénom du commercial prescripteur"
      - name: nom_entreprise
        description: "🏢 Nom de l'entreprise cliente"
      - name: titre_mission
        description: "📋 Titre de la mission"
      - name: statut
        description: "📊 Statut actuel dans le funnel"
      - name: date_statut
        description: "📅 Date du changement de statut"
      - name: commentaire
        description: "💬 Commentaire sur le statut"
      - name: source_batch
        description: "📦 Batch source pour traçabilité"
      - name: loaded_at
        description: "⏰ Timestamp de traitement dbt"

  - name: sankey_data
    description: |
      **📊 Table optimisée pour la visualisation Sankey**
      
      Données agrégées des transitions entre statuts pour alimenter le diagramme de Sankey.
      Calcule automatiquement les flux entre chaque étape du funnel commercial.
      
      **Logique :** 
      1. Ordonne chronologiquement les statuts par mission
      2. Identifie les transitions séquentielles
      3. Agrège les compteurs par type de transition
      
      **Usage principal :** 
      - Génération du diagramme de Sankey interactif
      - Analyse des parcours clients
      - Identification des points de friction
      
      **Export :** Automatiquement exporté vers scripts/data/sankey_transitions.csv
    columns:
      - name: source_statut
        description: |
          **📍 Statut de départ de la transition**
          
          Représente l'état initial avant le changement.
          Utilisé comme nœud source dans le diagramme de Sankey.
      - name: target_statut
        description: |
          **🎯 Statut d'arrivée de la transition**
          
          Représente l'état final après le changement.
          Utilisé comme nœud cible dans le diagramme de Sankey.
      - name: nb_transitions
        description: |
          **📈 Nombre total de transitions observées**
          
          Compteur du nombre de missions ayant effectué cette transition.
          Détermine la largeur des flux dans le diagramme de Sankey.
          
          **Tri :** Décroissant pour prioriser les flux principaux